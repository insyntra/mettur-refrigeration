<section><div class="w g2" style="align-items:start">
  <div>

    <a class="cl" href="tel:+918610654644"><div class="ic"><svg class="i"><use href="#phone"/></svg></div><div><span>Phone 1</span><b>8610654644</b></div></a>
    <a class="cl" href="tel:+919751766513"><div class="ic"><svg class="i"><use href="#phone"/></svg></div><div><span>Phone 2</span><b>9751766513</b></div></a>
    <div class="row">
      <a class="btn p" href="tel:+918610654644"><svg class="i"><use href="#phone"/></svg>Call now</a>
      <a class="btn s" href="https://wa.me/918610654644"><svg class="i"><use href="#wa"/></svg>WhatsApp now</a>
